[package]
name = "stremio-torrent"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
anyhow = "1"
fs2 = "0.4"
hex = "0.4"
librqbit = { version = "=9.1.0", default-features = false, features = ["rust-tls"] }
mime_guess = "2"
rand = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "sync", "net", "io-util", "time", "macros", "fs"] }
tokio-util = "0.7"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
